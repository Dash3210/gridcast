[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast"
version = "0.1.0"
description = "Forecasting service for Great Britain's half-hourly grid carbon intensity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<26",
    "requests>=2.31,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "lightgbm>=4.5,<5",
    "pydantic>=2.7,<3",
    "prometheus-client>=0.20,<1",
    "tzdata",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.17,<0.18",
    "mypy>=1.11,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridcast = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["gridcast"]

[tool.coverage.report]
fail_under = 85
