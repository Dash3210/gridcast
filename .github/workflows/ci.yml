name: CI

# No job may read data/scoreboard/scores.csv: the gate is a function of the model and the pinned fixture, nothing else.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI Accuracy Gate & Integrity Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # The Makefile resolves its interpreter to .venv/bin/python, so create that venv rather
        # than installing into the runner's system Python.
        run: |
          make install PYTHON=python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run check suite (lint, typecheck, test, data-check)
        run: make check

      # No job may read data/scoreboard/scores.csv: the gate is a function of the model and the pinned fixture, nothing else.
      - name: Run evaluation gate and assert PASS with fixture SHA-256
        run: |
          EVAL_OUTPUT=$(make eval)
          echo "$EVAL_OUTPUT"
          echo "$EVAL_OUTPUT" | grep -F "GATE VERDICT: PASS"
          echo "$EVAL_OUTPUT" | grep -F "87d322235bdc9de95c32a9622ca75b226ba9e30c3d1ce4e5126a93ac77e9eb51"

      - name: Run gate on negative control (assert rejection)
        run: make gate-negative

      # Serve-path check (platform-independent): verify pinned lgbm_model.txt & interval_v2.json
      # hashes and bitwise deterministic predictions (zero delta across Windows/Linux).
      # Train-path eval-reproduce is manual/platform-scoped because Linux 15-fold retraining
      # diverges structurally across 30/30 trees from the Windows-frozen fixture.
      - name: Verify pinned serve artifact determinism and hashes (eval-serve)
        run: |
          SERVE_OUTPUT=$(make eval-serve)
          echo "$SERVE_OUTPUT"
          echo "$SERVE_OUTPUT" | grep -F "SERVE GATE VERDICT: PASS"
          echo "$SERVE_OUTPUT" | grep -F "0.00000000"
          echo "$SERVE_OUTPUT" | grep -F "1cd13471d793735748f81d17fb195e34f6f784e8f642ac60a16f016280c45310"
          echo "$SERVE_OUTPUT" | grep -F "1688bc3f46e4a8e3ae0e4768bf3d800a2771e6b4c96f4039bc919469586c6acf"

      - name: Assert clean working tree (no writes under data/ or repository)
        run: git diff --exit-code

  docker:
    name: Docker Container Build & Smoke Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build production Docker image
        run: make docker

      - name: Assert Docker image size is under 400 MB
        run: |
          SIZE=$(docker image inspect gridcast:latest --format '{{.Size}}')
          echo "Docker image size: ${SIZE} bytes ($((SIZE / 1024 / 1024)) MiB)"
          if [ "$SIZE" -ge 419430400 ]; then
            echo "ERROR: Image size ${SIZE} bytes exceeds 400 MB limit (419430400 bytes)"
            exit 1
          fi

      - name: Assert container runs as non-root UID 10001
        run: |
          CONTAINER_UID=$(docker run --rm --entrypoint id gridcast:latest -u)
          echo "Container UID: ${CONTAINER_UID}"
          if [ "$CONTAINER_UID" != "10001" ]; then
            echo "ERROR: Expected non-root UID 10001, got ${CONTAINER_UID}"
            exit 1
          fi

      - name: Run eval-serve inside container with read-only data mounts
        run: |
          SERVE_OUTPUT=$(docker run --rm \
            -v "$PWD/data/curated:/app/data/curated:ro" \
            -v "$PWD/data/mix:/app/data/mix:ro" \
            gridcast:latest python -m gridcast.cli eval-serve)
          echo "$SERVE_OUTPUT"
          echo "$SERVE_OUTPUT" | grep -F "SERVE GATE VERDICT: PASS"
          echo "$SERVE_OUTPUT" | grep -F "0.00000000"
          echo "$SERVE_OUTPUT" | grep -F "1cd13471d793735748f81d17fb195e34f6f784e8f642ac60a16f016280c45310"
          echo "$SERVE_OUTPUT" | grep -F "1688bc3f46e4a8e3ae0e4768bf3d800a2771e6b4c96f4039bc919469586c6acf"

      - name: Smoke test containerized API endpoints and /reload auth
        run: |
          CONTAINER_NAME="gridcast-ci-smoke"
          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$CONTAINER_NAME" \
            -p 127.0.0.1:8000:8000 \
            -e GRIDCAST_RELOAD_TOKEN="ci-reload-smoke-token" \
            -v "$PWD/data/curated:/app/data/curated:ro" \
            -v "$PWD/data/mix:/app/data/mix:ro" \
            -v "$PWD/data/scoreboard:/app/data/scoreboard:ro" \
            gridcast:latest

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo false)" != "true" ]; then
              echo "Container exited prematurely:"
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for /health 200:"
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"

          with urllib.request.urlopen(f"{base}/health", timeout=5) as resp:
              assert resp.status == 200, f"/health status={resp.status}"
              health = json.loads(resp.read().decode("utf-8"))
              assert health["status"] == "healthy", health
              assert health["version"] == "lgbm-v2", health

          with urllib.request.urlopen(f"{base}/ready", timeout=5) as resp:
              assert resp.status == 200, f"/ready status={resp.status}"
              ready = json.loads(resp.read().decode("utf-8"))
              assert ready["status"] == "ready", ready
              assert ready["publish_deadline_utc"] == "11:00 UTC", ready
              for key in (
                  "publish_status",
                  "served_issue_time",
                  "is_current_issue",
                  "generation",
              ):
                  assert key in ready, f"/ready missing {key}: {ready}"

          with urllib.request.urlopen(f"{base}/model", timeout=5) as resp:
              assert resp.status == 200, f"/model status={resp.status}"
              model = json.loads(resp.read().decode("utf-8"))
              assert model["version"] == "lgbm-v2", model
              assert model["feature_count"] == 26, model
              assert (
                  model["content_sha256"]
                  == "1cd13471d793735748f81d17fb195e34f6f784e8f642ac60a16f016280c45310"
              ), model

          with urllib.request.urlopen(f"{base}/metrics", timeout=5) as resp:
              assert resp.status == 200, f"/metrics status={resp.status}"
              metrics_text = resp.read().decode("utf-8")
              assert "gridcast_requests_total" in metrics_text

          with urllib.request.urlopen(f"{base}/forecast?hours=48", timeout=10) as resp:
              assert resp.status == 200, f"/forecast status={resp.status}"
              forecast = json.loads(resp.read().decode("utf-8"))
              assert forecast["hours"] == 48, forecast
              assert forecast["model_version"] == "lgbm-v2", forecast
              points = forecast["points"]
              assert len(points) == 96, f"expected 96 points, got {len(points)}"
              for pt in points:
                  assert pt["lower"] <= pt["value"] <= pt["upper"], pt

          req = urllib.request.Request(f"{base}/reload", method="POST", data=b"")
          try:
              urllib.request.urlopen(req, timeout=5)
              raise AssertionError("Expected POST /reload without token to fail with 401")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"Expected 401 on unauthenticated /reload, got {exc.code}"

          auth_req = urllib.request.Request(
              f"{base}/reload",
              method="POST",
              data=b"",
              headers={"X-Reload-Token": "ci-reload-smoke-token"},
          )
          with urllib.request.urlopen(auth_req, timeout=5) as resp:
              assert resp.status == 200, f"authenticated /reload status={resp.status}"
              reloaded = json.loads(resp.read().decode("utf-8"))
              assert reloaded["status"] == "reloaded", reloaded
              assert reloaded["model_version"] == "lgbm-v2", reloaded
              assert reloaded["generation"] >= 2, reloaded

          print(
              "Docker API smoke checks passed: "
              "/health, /ready, /model, /metrics, /forecast?hours=48, /reload (401 -> 200)."
          )
          PY
