# Note: P5 will extend this workflow into the full CI/CD pipeline (Docker build, eval gate, lint).
# This minimal workflow runs the nightly ingest, baseline forecast issue, and scoreboard scoring.

name: Nightly Forecast & Scoreboard

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Ingest recent data
        run: make ingest

      - name: Issue persistence baseline forecast
        run: gridcast forecast

      - name: Score settled forecasts and update scoreboard
        run: gridcast score

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curated data/weather data/mix data/scoreboard docs/scoreboard.md
          git diff --staged --quiet || git commit -m "chore(data): nightly ingest and scoreboard update for $(date -u +'%Y-%m-%d')"
          git push
